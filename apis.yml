aid: baseframe
name: Baseframe
description: >-
  BaseFrame (baseframe.co) is a Y Combinator (W26) startup building an AI
  workflow discovery platform for teams and small businesses. Its privacy-first
  desktop application analyzes historical work patterns across email, documents,
  Slack, calendar, browser activity, and files using on-device local models to
  identify high-value, repetitive tasks and recommend concrete AI automations,
  then helps users set them up in the tools they already use. BaseFrame publishes
  no public developer API, SDKs, or OpenAPI at this time; it is a consumer/desktop
  product with SaaS integrations (Gmail, Slack, HubSpot, Salesforce, Google
  Sheets, Office 365, Jira). Founded in 2025 by Anshul Paul and Vaibhav Agrawal.
